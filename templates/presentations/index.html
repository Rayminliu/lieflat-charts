</style></head><body><main class="sheet"><div class="mast"><b>Lieflat Charts / Presentation Mode</b><span>16:9 · 1600×900</span></div><h1>把图表放进一套能讲清楚的演示。</h1><p>这里的模板只负责画布、翻页、打印和页面节奏。数据进入哪一种图表，仍由 <code>catalog.md</code> 按数据形状决定。复制语言版本后，替换所有示例文案、数字、来源和 aria-label。</p><div class="links"><a href="presentation.zh.html">中文版模板<small>宋体标题 · 黑体正文 · Inter 数字</small></a><a href="presentation.en.html">English template<small>Inter typography · single-file HTML</small></a></div></main></body></html>
